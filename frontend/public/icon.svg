<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="tabGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container with Glow -->
  <rect width="64" height="64" rx="14" fill="#090d16" />
  <circle cx="32" cy="32" r="28" fill="url(#tabGlow)" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- DETECTIVE HAT (Sherlock Deerstalker Silhouette) -->
  <!-- Top dome -->
  <path d="M 20 25 C 20 14, 44 14, 44 25 Z" fill="url(#hatGrad)" />
  
  <!-- Hat Crown Ribbon & Bow -->
  <path d="M 21 24 C 28 22, 36 22, 43 24 L 43 26 C 36 24, 28 24, 21 26 Z" fill="#0c4a6e" />
  <path d="M 32 14 C 30 11, 34 11, 32 14" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Front and Back Visors (Brims) -->
  <path d="M 12 28 C 17 26, 21 25, 23 25 C 23 23, 41 23, 41 25 C 43 25, 47 26, 52 28 C 47 30, 42 28, 38 27 C 26 27, 22 28, 12 28 Z" fill="#38bdf8" filter="url(#neon)" />
  
  <!-- Ear Flaps tied up at top -->
  <path d="M 24 23 C 24 18, 28 16, 32 15 C 36 16, 40 18, 40 23 C 37 20, 27 20, 24 23 Z" fill="#0284c7" opacity="0.9" />

  <!-- DETECTIVE COAT COLLAR -->
  <path d="M 22 46 L 27 34 L 37 34 L 42 46 Z" fill="#1e293b" />
  <path d="M 27 34 L 32 41 L 37 34" stroke="#0ea5e9" stroke-width="1.5" stroke-linejoin="round" />

  <!-- MAGNIFYING GLASS (Foreground Detective Tool) -->
  <!-- Handle -->
  <line x1="39" y1="41" x2="52" y2="54" stroke="url(#hatGrad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="39" y1="41" x2="52" y2="54" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" filter="url(#neon)" />
  
  <!-- Outer Rim with Neon Glow -->
  <circle cx="33" cy="35" r="12" fill="#050811" stroke="url(#lensGrad)" stroke-width="2.8" filter="url(#neon)" />
  <circle cx="33" cy="35" r="9.5" fill="#0c1f38" opacity="0.85" />
  
  <!-- Lens Glare -->
  <path d="M 27 29 A 7 7 0 0 1 37 29" stroke="#e0f2fe" stroke-width="1" stroke-linecap="round" opacity="0.6" />

  <!-- Mini Cyber Bug / Target Cursor inside Lens -->
  <circle cx="33" cy="35" r="2.5" fill="url(#amberGrad)" filter="url(#neon)" />
  <path d="M 33 30 L 33 32 M 33 38 L 33 40 M 28 35 L 30 35 M 36 35 L 38 35" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" />
</svg>
