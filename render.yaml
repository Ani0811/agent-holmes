services:
  - type: web
    name: agent-holmes-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WORKSPACES_DIR
        value: /tmp/workspaces
      - key: FRONTEND_URL
        value: https://agent-holmes-zeta.vercel.app
      - key: CORS_ORIGINS
        value: https://agent-holmes-zeta.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: agent-holmes-db
          property: connectionString
      - key: BOB_API_KEY
        sync: false
      - key: BOB_API_BASE
        value: http://localhost:11434
      - key: BOB_MODEL
        value: ibm-granite-code

databases:
  - name: agent-holmes-db
    plan: free
    databaseName: holmes
    user: holmes_user
